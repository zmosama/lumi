version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: lumi-db-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-lumi}
    ports:
      - "5432:5432"
    volumes:
      - lumi_pgdata_prod:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lumi-redis-prod
    ports:
      - "6379:6379"
    volumes:
      - lumi_redisdata_prod:/data
    restart: always

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: lumi-api-prod
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-lumi}?schema=public
      - JWT_SECRET=${JWT_SECRET:-super-secret-key-for-prod-change-me}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_ENV=production
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: lumi-web-prod
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      - NODE_ENV=production
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: always

volumes:
  lumi_pgdata_prod:
  lumi_redisdata_prod:
